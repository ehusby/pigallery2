version: '3'
services:
  pigallery2:
    image: bpatrik/pigallery2:latest-debian-buster # TODO: change it back to latest once relese workflow gets fixed
    container_name: pigallery2
    environment:
      - NODE_ENV=production
    volumes:
      - "/media/pi/CRUST/piserve/config:/app/data/config" # CHANGE ME
      - "db-data:/app/data/db"
      - "/media/pi/CRUST/piserve/images:/app/data/images" # CHANGE ME
      - "/media/pi/CRUST/piserve/tmp:/app/data/tmp" # CHANGE ME
    ports:
      - 80:80
    restart: always

volumes:
  db-data:
